# ChatGPT joue des parties entières de L'Express de Minuit et relève ce qui sonne faux.
# Se lance à la main (onglet Actions → Testeur IA → Run workflow). Par défaut : simulation gratuite.
name: Testeur IA
run-name: "Testeur IA — ${{ inputs.simulation && 'simulation gratuite' || 'parties RÉELLES' }} — ${{ inputs.parties }} partie(s) depuis ${{ inputs.depart }}, profil ${{ inputs.profil }}"

on:
  workflow_dispatch:
    inputs:
      simulation:
        description: "Simulation gratuite (aucun appel à OpenAI). Décochez pour faire jouer ChatGPT, payant."
        type: boolean
        default: true
      parties:
        description: "Nombre de parties"
        type: choice
        options: ["1", "3", "6", "12", "18"]
        default: "3"
      profil:
        description: "Façon de jouer"
        type: choice
        options: [tous, methodique, bavard, absurde, menteur, presse, fautes]
        default: tous
      personnage:
        description: "Personnage joué"
        type: choice
        options: [tous, pemberton, doyle, ashby, prologue]
        default: tous
      depart:
        description: "Chapitre de départ (Londres enchaîne sur Paris et Poissy avec le même investigateur)"
        type: choice
        options: [londres, paris, prologue]
        default: londres
      tours:
        description: "Nombre maximal de tours par partie, tous chapitres confondus"
        type: string
        default: "500"
      modele:
        description: "Modèle OpenAI qui joue et relit"
        type: choice
        options: [gpt-5.6-luna, gpt-5.6-terra]
        default: gpt-5.6-luna
      plafond:
        description: "Plafond de dépense, en dollars, pour ce lancement"
        type: string
        default: "3"

permissions:
  contents: write  # publier les transcriptions sur la branche « tests-ia »

concurrency:
  group: testeur
  cancel-in-progress: false

jobs:
  jouer:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Vérifier la clé OpenAI
        if: ${{ !inputs.simulation }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "::error::Le secret OPENAI_API_KEY est absent."; exit 1; fi
          echo "Clé présente (sa valeur n'est jamais affichée)."

      - name: Faire jouer les parties
        timeout-minutes: 300
        env:
          OPENAI_API_KEY: ${{ !inputs.simulation && secrets.OPENAI_API_KEY || '' }}
          SIMULATION: ${{ inputs.simulation }}
          PARTIES: ${{ inputs.parties }}
          PROFIL: ${{ inputs.profil }}
          PERSONNAGE: ${{ inputs.personnage }}
          DEPART: ${{ inputs.depart }}
          TOURS: ${{ inputs.tours }}
          MODELE: ${{ inputs.modele }}
          PLAFOND: ${{ inputs.plafond }}
        run: |
          options=()
          if [ "$SIMULATION" = "true" ]; then options+=(--simulation); fi
          node testeur/jouer.js "${options[@]}" --parties "$PARTIES" --profil "$PROFIL" --personnage "$PERSONNAGE" --depart "$DEPART" \
            --paralleles 6 --tours "$TOURS" --modele "$MODELE" --plafond "$PLAFOND"

      # chaque lancement range ses transcriptions dans son propre dossier : deux lancements ne s'écrasent pas
      - name: Publier les transcriptions sur la branche « tests-ia »
        if: ${{ always() && hashFiles('testeur/sortie/rapport.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DOSSIER: ${{ format('{0}-{1}-{2}', github.run_number, inputs.depart, inputs.simulation && 'simulation' || 'reel') }}
        run: |
          depot="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$depot" tests-ia >/dev/null; then git clone -q --depth 1 -b tests-ia "$depot" /tmp/tests-ia
          else git init -q -b tests-ia /tmp/tests-ia; fi
          mkdir -p "/tmp/tests-ia/$DOSSIER" && cp -r testeur/sortie/. "/tmp/tests-ia/$DOSSIER/"
          cd /tmp/tests-ia
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Testeur IA ${DOSSIER} : $(find "$DOSSIER" -maxdepth 1 -name 'partie_*.md' | wc -l) partie(s)"
          for essai in 1 2 3; do git push -q "$depot" HEAD:tests-ia && break; git pull -q --rebase "$depot" tests-ia; done

      - name: Joindre les transcriptions
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: transcriptions-testeur-ia
          path: testeur/sortie/
          retention-days: 30
          if-no-files-found: ignore
